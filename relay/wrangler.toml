# Sideways GP relay on Cloudflare Workers (free plan).
# Deploy from this folder:  npx wrangler login   then   npx wrangler deploy
name = "sideways-gp-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "BOARD"
class_name = "Leaderboard"

# SQLite-backed Durable Objects are the kind available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Leaderboard"]

# Optional: only accept connections from your game's address, e.g.
# [vars]
# ALLOWED_ORIGINS = "https://sideways-gp.vercel.app"
